<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="超盟工程管理系統">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="超盟工程">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">
  <link rel="icon" type="image/png" href="icons/Icon-192.png?v=3"/>

  <title>超盟工程</title>
  <link rel="manifest" href="manifest.json?v=3">

  <style>
    body, html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
  <script>
    let lastHeight = window.innerHeight;
    window.addEventListener('resize', () => {
      // 如果視窗高度突然變大超過 50px，代表系統鍵盤被收起來了
      if (window.innerHeight > lastHeight + 50) {
        // 強制讓網頁底層失去焦點，這會直接通知 Flutter 收回白塊殘影！
        if (document.activeElement) {
          document.activeElement.blur();
        }
      }
      lastHeight = window.innerHeight;
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
