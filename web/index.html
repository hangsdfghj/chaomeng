<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="超盟工程管理系統">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="超盟工程">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">
  <link rel="icon" type="image/png" href="icons/Icon-192.png?v=3"/>

  <title>超盟工程</title>
  <link rel="manifest" href="manifest.json?v=3">

  <style>
    /* 鎖死畫布，強制固定在最頂部，不允許被鍵盤推上去下不來 */
    body, html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      position: fixed; 
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <script>
    // 🚀 終極殺手鐧：VisualViewport API 
    // 這是現代瀏覽器專門用來「精準捕捉」虛擬鍵盤高度的唯一標準
    if (window.visualViewport) {
      let maxHeight = window.visualViewport.height;
      
      window.visualViewport.addEventListener('resize', () => {
        // 隨時記錄螢幕的最大高度 (代表鍵盤完全收起時的真實高度)
        if (window.visualViewport.height > maxHeight) {
          maxHeight = window.visualViewport.height;
        }
        
        // 當目前可視高度恢復到接近最大高度時 (代表系統返回鍵強殺了鍵盤)
        if (window.visualViewport.height >= maxHeight - 50) {
          
          // 1. 強制拔除所有底層隱藏輸入框的焦點，通知 Flutter 放棄鎖定
          if (document.activeElement) {
            document.activeElement.blur();
          }
          
          // 2. 最關鍵：把被瀏覽器強制推上去的網頁畫布，狠狠拉回座標 (0,0)！
          window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
          document.body.scrollTop = 0;
          document.documentElement.scrollTop = 0;
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
